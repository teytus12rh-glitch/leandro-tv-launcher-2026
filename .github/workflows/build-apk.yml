name: Build Leandro TV Launcher APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Leandro TV OS
    runs-on: ubuntu-latest

    steps:
    - name: Baixar Código do Repositório
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar Android SDK
      uses: android-actions/setup-android@v3

    - name: Configurar Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Gerar Gradle Wrapper se necessário
      run: |
        if [ ! -f gradlew ]; then
          gradle wrapper --gradle-version 8.4
        fi
        chmod +x gradlew

    - name: Compilar APK (assembleDebug)
      run: ./gradlew assembleDebug --stacktrace

    - name: Disponibilizar APK para Download
      uses: actions/upload-artifact@v4
      with:
        name: Leandro-TV-Launcher-AppleTV-Edition
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
